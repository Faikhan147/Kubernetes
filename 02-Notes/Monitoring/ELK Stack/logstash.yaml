# ==================== Logstash logs from my-applications namespace ====================

nano logstash.yaml
kubectl apply -f logstash.yaml


apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: elk-stack-logging
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
    - name: http
      port: 9600
      targetPort: 9600

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: elk-stack-logging
  labels:
    app: logstash
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      # Parse JSON logs only if valid
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
          target => "json"
        }
        mutate {
          add_tag => ["_jsonparsed"]
        }
      }

      # Kubernetes metadata (if present)
      if [kubernetes] {
        mutate {
          add_field => {
            "k8s_namespace" => "%{[kubernetes][namespace]}"
            "k8s_pod"       => "%{[kubernetes][pod][name]}"
            "k8s_node"      => "%{[kubernetes][node][name]}"
            "k8s_container" => "%{[kubernetes][container][name]}"
          }
        }
      }

      # Drop logs not from my-applications namespace
      if [k8s_namespace] != "my-applications" {
        drop { }
      }
    }

    output {
      # Raw logs
      elasticsearch {
        hosts => ["http://elasticsearch.elk-stack-logging.svc:9200"]
        index => "filebeat-my-applications-namespace-logs-raw-%{+YYYY.MM.dd}"
      }

      # JSON parsed logs
      if "_jsonparsed" in [tags] {
        elasticsearch {
          hosts => ["http://elasticsearch.elk-stack-logging.svc:9200"]
          index => "filebeat-my-applications-namespace-logs-json-%{+YYYY.MM.dd}"
        }
      }

      # Debug
      stdout { codec => rubydebug }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: elk-stack-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:7.17.15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5044
            - containerPort: 9600
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: pipeline-volume
              mountPath: /usr/share/logstash/pipeline
      volumes:
        - name: pipeline-volume
          configMap:
            name: logstash-pipeline
            items:
              - key: logstash.conf
                path: logstash.conf
