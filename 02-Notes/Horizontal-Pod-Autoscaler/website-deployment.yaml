nano website-deployment.yaml
kubectl apply -f website-deployment.yaml



apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: my-applications
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
      - name: website
        image: faisalkhan35/my-website:latest
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

---

apiVersion: v1
kind: Service
metadata:
  name: website-lb
  namespace: my-applications
spec:
  selector:
    app: website
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer

